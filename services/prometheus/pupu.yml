global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus-self"
    static_configs:
      - targets: ["localhost:9090"]
 
  - job_name: "app-prometheus"
    metrics_path: "/actuator/prometheus"
    basic_auth:
      username: "monitoring"
      password_file: "/etc/prometheus/monitoring_password.txt"
    static_configs:
      - targets: ["158.160.224.83:9090"]

  - job_name: "nodes"
    scrape_timeout: 20s
    static_configs:
      - targets: 
        - "158.160.224.83:9100"
        - "84.201.147.72:9100"
