groups:
  - name: application
    rules:
      - alert: ApplicationHttp5xxRateHigh
        expr: |
          100 * (
            sum(rate(http_server_requests_seconds_count{job="app-prometheus", status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="app-prometheus"}[5m]))
          ) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx rate in the application"
          description: "More than 5% of application HTTP requests returned 5xx for five minutes."